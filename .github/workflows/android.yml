name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config perl build-essential
          sdkmanager --install "ndk;29.0.13846066" "build-tools;34.0.0"
          echo "NDK_HOME=${{ env.ANDROID_HOME }}/ndk/29.0.13846066" >> $GITHUB_ENV
          echo "${{ env.ANDROID_HOME }}/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "${{ env.ANDROID_HOME }}/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install npm dependencies
        run: npm ci

      - name: Build Android APK
        run: |
          npx tauri android build --apk

      - name: Sign Android APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias zyntratek -keyalg RSA -keysize 2048 -validity 10000 -storepass zyntratek123 -keypass zyntratek123 -dname "CN=Zyntratek, OU=Mobile, O=Zyntratek, L=Global, S=Global, C=US"
          shopt -s globstar
          for apk in src-tauri/gen/android/app/build/outputs/apk/**/*.apk; do
            if [[ "$apk" == *"-unsigned.apk" ]]; then
              signed_apk="${apk/-unsigned.apk/-signed.apk}"
              echo "Firmando $apk -> $signed_apk"
              apksigner sign --ks release.keystore --ks-pass pass:zyntratek123 --key-pass pass:zyntratek123 --out "$signed_apk" "$apk"
            fi
          done

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyntratek-remote-manager-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*-signed.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

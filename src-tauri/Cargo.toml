[package]
name = "zyntratek-remote-manager"
version = "1.0.0"

description = "Zyntratek Remote Manager - Secure Remote Desktop & SSH Manager"
authors = ["Zyntratek"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
keyring = "3.0.0"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
dirs = "5.0"
url = "2.5"

russh = "0.49.2"
russh-keys = "0.49.0"
ssh-key = "0.6.7"
ssh2 = "0.9"

async-trait = "0.1"







[dev-dependencies]
tempfile = "3.8"
